# Render Blueprint (alternative to Railway)
services:
  - type: web
    name: background-remover
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: BG_PROVIDER
        value: local
      - key: BIREFNET_MODEL
        value: birefnet-general-lite
      - key: PERFORMANCE_PROFILE
        value: low
      - key: UNLOAD_MODELS_AFTER_USE
        value: "true"
      - key: USE_GFPGAN_MODEL
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: SAFE_INPUT_SIDE
        value: "1280"
      - key: REALESRGAN_TILE
        value: "96"
